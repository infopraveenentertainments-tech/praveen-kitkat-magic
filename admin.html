<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Praveen Kitkat Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font-family:Arial,sans-serif}main{max-width:1100px;margin:auto;padding:24px 16px}h1,h2{font-family:Georgia,serif}.gold{color:#f6c542}.box{background:#111;border:1px solid #292929;border-radius:16px;padding:20px;margin:18px 0}input,textarea,select{width:100%;padding:13px;margin:7px 0 14px;background:#0b0b0b;color:#eee;border:1px solid #444;border-radius:8px}button{padding:12px 16px;border:0;border-radius:8px;background:#f6c542;color:#080808;font-weight:bold;cursor:pointer}.secondary{background:#292929;color:#fff}.danger{background:#a33;color:#fff}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.card{background:#0d0d0d;border:1px solid #292929;border-radius:12px;padding:16px;margin:12px 0}.card h3{margin:0 0 8px}.meta{color:#bbb;line-height:1.7}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.status{display:inline-block;padding:5px 10px;border-radius:20px;background:#2b2512;color:#f6c542;font-size:13px}.msg{color:#f6c542;min-height:20px}.error{color:#ff7777}.small{font-size:13px;color:#999}#app{display:none}.empty{padding:20px;text-align:center;color:#999}a{text-decoration:none}</style></head><body><main>
<div class="top"><h1>PRAVEEN <span class="gold">KITKAT</span> — Admin</h1><button id="logout" style="display:none">Logout</button></div>
<div id="login" class="box"><h2>Admin Login</h2><p class="small">Use your Supabase Auth email and password.</p><input id="email" type="email" placeholder="Admin email" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn">Login</button><p id="loginMsg" class="msg"></p></div>
<div id="app">
<div class="box"><div class="top"><div><h2 style="margin-bottom:5px">Booking Enquiries</h2><div class="small">Live enquiries from your website</div></div><button id="refreshBtn" class="secondary">Refresh</button></div><p id="bookingMsg" class="msg"></p><div id="bookings">Loading...</div></div>
<div class="box"><h2>Site Content</h2><label>About text</label><textarea id="about" rows="5"></textarea><label>Hero image URL</label><input id="hero_image" placeholder="https://..."><button id="saveContent">Save Content</button><p id="contentMsg" class="msg"></p></div>
<div class="box"><h2>Add Gallery Item</h2><input id="gTitle" placeholder="Title"><input id="gUrl" placeholder="Public image/video URL"><select id="gType"><option value="image">Image</option><option value="video">Video</option></select><button id="addGallery">Add to Gallery</button><p id="galleryMsg" class="msg"></p></div>
<div class="box"><h2>Gallery</h2><div id="galleryAdmin">Loading...</div></div>
</div></main>
<script>
const sb=supabase.createClient("https://umpdcdzynnqgbzmfwiyw.supabase.co","sb_publishable_InXm_68VoBtAI4opM5fbmw_0J7Z3Ita");const $=id=>document.getElementById(id);const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
async function checkLogin(){const{data,error}=await sb.auth.getUser();const ok=!error&&!!data.user;$("login").style.display=ok?"none":"block";$("app").style.display=ok?"block":"none";$("logout").style.display=ok?"block":"none";return ok}
async function loadBookings(){const{data,error}=await sb.from("bookings").select("*").order("created_at",{ascending:false});if(error){$("bookings").innerHTML="";$("bookingMsg").innerHTML='<span class="error">Could not load bookings: '+esc(error.message)+'</span>';return}$("bookingMsg").textContent="";if(!data?.length){$("bookings").innerHTML='<div class="empty">No booking enquiries yet.</div>';return}$("bookings").innerHTML=data.map(x=>{const created=x.created_at?new Date(x.created_at).toLocaleString():"";return `<div class="card"><h3>${esc(x.name||"No name")} <span class="status">${esc(x.status||"New")}</span></h3><div class="meta"><b>Phone / WhatsApp:</b> ${esc(x.phone||"-")}<br><b>Event:</b> ${esc(x.event||"-")}<br><b>Date:</b> ${esc(x.date||"-")}<br><b>Location:</b> ${esc(x.location||"-")}<br><b>Guests:</b> ${esc(x.guests||"-")}<br><b>Message:</b> ${esc(x.message||"-")}<br><b>Received:</b> ${esc(created)}</div><div class="actions"><a href="https://wa.me/${encodeURIComponent((x.phone||"").replace(/[^0-9]/g,""))}" target="_blank" rel="noopener"><button type="button">WhatsApp</button></a><button type="button" class="danger" onclick="deleteBooking('${esc(x.id)}')">Delete</button></div></div>`}).join("")}
async function deleteBooking(id){if(!confirm("Delete this booking enquiry?"))return;const{error}=await sb.from("bookings").delete().eq("id",id);if(error){alert("Delete failed: "+error.message);return}loadBookings()}
async function loadContent(){const{data,error}=await sb.from("site_content").select("*");if(error){$("contentMsg").innerHTML='<span class="error">Site content unavailable: '+esc(error.message)+'</span>';return}const map=Object.fromEntries((data||[]).map(x=>[x.key,x.value]));$("about").value=map.about||"";$("hero_image").value=map.hero_image||""}
async function saveContent(){
 $("contentMsg").textContent="Saving...";for(const row of[{key:"about",value:$("about").value},{key:"hero_image",value:$("hero_image").value}]){const{error}=await sb.from("site_content").upsert(row,{onConflict:"key"});if(error){$("contentMsg").innerHTML='<span class="error">Save failed: '+esc(error.message)+'</span>';return}}$("contentMsg").textContent="Saved successfully."}
async function loadGallery(){const{data,error}=await sb.from("gallery").select("*").order("created_at",{ascending:false});if(error){$("galleryAdmin").innerHTML='<span class="error">Gallery unavailable: '+esc(error.message)+'</span>';return}if(!data?.length){$("galleryAdmin").innerHTML='<div class="empty">No gallery items yet.</div>';return}$("galleryAdmin").innerHTML=data.map(x=>`<div class="card"><b>${esc(x.title||"Untitled")}</b><div class="small">${esc(x.media_type||"image")} — ${esc(x.url||"")}</div><div class="actions"><button class="danger" type="button" onclick="deleteGallery('${esc(x.id)}')">Delete</button></div></div>`).join("")}
async function addGallery(){const title=$("gTitle").value.trim(),url=$("gUrl").value.trim(),media_type=$("gType").value;if(!url){$("galleryMsg").innerHTML='<span class="error">Please enter a public URL.</span>';return}$("galleryMsg").textContent="Adding...";const{error}=await sb.from("gallery").insert({title,url,media_type});if(error){$("galleryMsg").innerHTML='<span class="error">Add failed: '+esc(error.message)+'</span>';return}$("gTitle").value="";$("gUrl").value="";$("galleryMsg").textContent="Added successfully.";loadGallery()}
async function deleteGallery(id){if(!confirm("Delete this gallery item?"))return;const{error}=await sb.from("gallery").delete().eq("id",id);if(error){alert("Delete failed: "+error.message);return}loadGallery()}
async function refresh(){if(await checkLogin())await Promise.all([loadBookings(),loadContent(),loadGallery()])}
$("loginBtn").onclick=async()=>{ $("loginMsg").textContent="Logging in...";const{error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error){$("loginMsg").innerHTML='<span class="error">'+esc(error.message)+'</span>';return}$("loginMsg").textContent="";refresh()};$("logout").onclick=async()=>{await sb.auth.signOut();refresh()};$("refreshBtn").onclick=refresh;$("saveContent").onclick=saveContent;$("addGallery").onclick=addGallery;sb.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh();
</script></body></html>
