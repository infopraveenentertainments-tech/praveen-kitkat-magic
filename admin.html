<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Praveen Kitkat — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="wrap">
<header><div class="brand">PRAVEEN <span>KITKAT</span> <small>ADMIN</small></div><button id="logout" class="ghost">Log out</button></header>
<section id="loginPanel" class="panel">
<h1>Admin Login</h1><p>Sign in with the admin account created in Supabase.</p>
<form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button><div id="loginStatus"></div></form>
</section>
<div id="dashboard" hidden>
<div class="tabs"><button data-tab="content">Content</button><button data-tab="services">Services</button><button data-tab="gallery">Gallery</button><button data-tab="videos">Videos</button><button data-tab="enquiries">Enquiries</button></div>

<section id="tab-content" class="panel tab"><h2>Homepage & About</h2>
<label>Hero eyebrow<input id="heroEyebrow"></label><label>Hero title<input id="heroTitle"></label><label>Hero description<textarea id="heroText"></textarea></label>
<label>About text<textarea id="aboutText"></textarea></label><button id="saveContent">Save content</button><div id="contentStatus"></div></section>

<section id="tab-services" class="panel tab" hidden><h2>Services</h2><form id="serviceForm"><input name="title" placeholder="Service title" required><textarea name="description" placeholder="Description" required></textarea><button>Add service</button></form><div id="servicesAdmin"></div></section>

<section id="tab-gallery" class="panel tab" hidden><h2>Gallery</h2><p>Upload an image and give it a title. Files are stored in Supabase Storage.</p><form id="galleryForm"><input name="title" placeholder="Title" required><input name="file" type="file" accept="image/*" required><button>Upload image</button></form><div id="galleryAdmin"></div></section>

<section id="tab-videos" class="panel tab" hidden><h2>Videos</h2><form id="videoForm"><input name="title" placeholder="Video title" required><input name="url" placeholder="Public MP4 URL" required><button>Add video</button></form><div id="videosAdmin"></div></section>

<section id="tab-enquiries" class="panel tab" hidden><h2>Booking enquiries</h2><div id="enquiriesAdmin"></div></section>
</div></div>
<script src="admin.js"></script>
</body>
</html>
