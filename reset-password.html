<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — Praveen Kitkat</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const URL="https://umpdcdzynnqgbzmfwiyw.supabase.co",KEY="sb_publishable_InXm_68VoBtAI4opM5fbmw_0J7Z3Ita",SITE="https://praveen-kitkat-magic.info-praveenkitkat.workers.dev",sb=supabase.createClient(URL,KEY),$=id=>document.getElementById(id);
let ready=false;
function fail(t){$("form").style.display="none";$("msg").textContent=t;$("msg").className="msg error"}
async function check(){const h=new URLSearchParams(location.hash.replace(/^#/,"")),e=h.get("error_description");if(e){fail("Reset link error: "+decodeURIComponent(e.replace(/\+/g," ")));return}const {data:{session}}=await sb.auth.getSession();if(session){ready=true;$("msg").textContent="Link is valid. Enter your new password."}else fail("This reset link is missing or expired. Go to "+SITE+"/admin.html and request a new one.")}

$("go").onclick=async()=>{if(!ready){await check();if(!ready)return}const p=$("p").value,c=$("c").value;if(p.length<6){$("msg").textContent="Password must be at least 6 characters.";return}if(p!==c){$("msg").textContent="Passwords do not match.";return}$("go").disabled=true;$("go").textContent="Updating...";const {error}=await sb.auth.updateUser({password:p});if(error){$("msg").textContent=error.message;$("go").disabled=false;$("go").textContent="Update Password";return}$("form").style.display="none";$("msg").innerHTML='Password updated successfully. <a href="'+SITE+'/admin.html">Go to Admin Login</a>';$("msg").className="msg success"};check();
